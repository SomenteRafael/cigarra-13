<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cigarra 13</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #placar {
            color: #ffffff;
            background-color: #cc0000;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 2px solid #ffffff;
            z-index: 10;
        }

        #game-container {
            position: relative;
            width: 95vmin;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(204, 0, 0, 0.3);
            border: 2px solid #cc0000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        /* ==== CONTAINER DO VÍDEO ==== */
        #video-container {
            display: none;
            position: relative;
            width: 95vmin;
            max-width: 550px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(204, 0, 0, 0.5);
            border: 2px solid #cc0000;
            overflow: hidden;
            z-index: 50;
        }

        #player-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            outline: none;
        }

        /* ==== TELAS DE SOBREPOSIÇÃO ==== */
        .tela-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('cigarra.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
            cursor: pointer;
        }

        .tela-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(139, 0, 0, 0.85);
            z-index: 1;
        }

        .conteudo-overlay {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
        }

        /* ==== ESTRELAS DO PT ==== */
        .pt-estrela-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pt-estrela {
            width: 100%;
            height: 100%;
            fill: #ffffff;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
            animation: pulsarEstrela 1.2s infinite alternate;
        }

        .pt-numero {
            position: absolute;
            color: #cc0000;
            font-size: 2.3rem;
            font-weight: 900;
            font-family: Arial, sans-serif;
        }

        @keyframes pulsarEstrela {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .estrela-flutuante {
            position: absolute;
            color: #ffcc00;
            font-size: 1.8rem;
            animation: flutuarEstrela 2s infinite ease-in-out alternate;
            z-index: 2;
            text-shadow: 0 0 10px #ffcc00;
        }

        @keyframes flutuarEstrela {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(-15px) rotate(15deg); opacity: 1; }
        }

        .titulo-jogo {
            font-size: 2.6rem;
            font-weight: 900;
            color: #ffffff;
            margin: 0 0 10px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }

        .subtitulo-vitoria {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffeb3b;
            margin: 5px 0;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.8), 2px 2px 4px rgba(0,0,0,0.9);
            animation: piscarTexto 1s infinite alternate;
        }

        @keyframes piscarTexto {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        .texto-overlay {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-top: 10px;
        }

        .animar-container {
            animation: entradaEpica 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes entradaEpica {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="placar">Cascas: 0 / 13</div>

    <!-- Container do Jogo -->
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- Container do Vídeo (Com playsinline e muted para garantir renderização da imagem) -->
    <div id="video-container">
        <video id="player-video" playsinline muted autoplay></video>
    </div>

    <!-- Tela de Início -->
    <div id="tela-inicio" class="tela-overlay">
        <div class="conteudo-overlay animar-container">
            <div class="pt-estrela-container">
                <svg class="pt-estrela" viewBox="0 0 24 24">
                    <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                </svg>
                <span class="pt-numero">13</span>
            </div>
            <h1 class="titulo-jogo">CIGARRA 13</h1>
            <div class="texto-overlay">Toque para iniciar</div>
        </div>
    </div>

    <!-- Tela de Game Over -->
    <div id="tela-gameover" class="tela-overlay" style="display: none;">
        <div class="conteudo-overlay animar-container">
            <div class="pt-estrela-container">
                <svg class="pt-estrela" viewBox="0 0 24 24">
                    <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                </svg>
                <span class="pt-numero">13</span>
            </div>
            <div class="texto-overlay" style="font-size: 1.5rem;">
                Fim de jogo!<br><span style="font-size: 1rem; font-weight: normal;">Toque em qualquer lugar para tentar de novo</span>
            </div>
        </div>
    </div>

    <!-- Tela de Vitória Temática PT / Lulista -->
    <div id="tela-vitoria" class="tela-overlay" style="display: none;">
        <div class="estrela-flutuante" style="top: 15%; left: 10%; animation-delay: 0.1s;">★</div>
        <div class="estrela-flutuante" style="top: 25%; right: 12%; animation-delay: 0.4s;">★</div>
        <div class="estrela-flutuante" style="bottom: 20%; left: 15%; animation-delay: 0.7s;">★</div>
        <div class="estrela-flutuante" style="bottom: 25%; right: 18%; animation-delay: 0.3s;">★</div>

        <div class="conteudo-overlay animar-container">
            <div class="pt-estrela-container">
                <svg class="pt-estrela" viewBox="0 0 24 24">
                    <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                </svg>
                <span class="pt-numero">13</span>
            </div>
            
            <h1 class="titulo-jogo" style="margin-bottom: 5px;">A CIGARRA VENCEU!</h1>
            <h2 class="subtitulo-vitoria">VIVA LULA! 🌟</h2>
            
            <div class="texto-overlay" style="font-size: 1.1rem; color: #ffcc00; margin-top: 15px;">
                Toque em qualquer lugar para assistir à vitória!
            </div>
        </div>
    </div>

    <script>
        const CAMINHO_VIDEO_VITORIA = "cigarra.mp4";

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        const telaInicio = document.getElementById("tela-inicio");
        const telaGameOver = document.getElementById("tela-gameover");
        const telaVitoria = document.getElementById("tela-vitoria");
        const placarElemento = document.getElementById("placar");
        const gameContainer = document.getElementById("game-container");
        const videoContainer = document.getElementById("video-container");
        const video = document.getElementById("player-video");

        const tamanhoTile = 20;
        const totalTiles = canvas.width / tamanhoTile;
        const META_VITORIA = 13; 
        
        let cigarra = [];
        let direcao = { x: 0, y: 0 };
        let proximaDirecao = { x: 0, y: 0 };
        let folha = { x: 0, y: 0 };
        let placar = 0;
        let estadoJogo = "inicio"; 
        let loopJogo;

        function iniciarJogo() {
            telaInicio.style.display = "none";
            telaGameOver.style.display = "none";
            telaVitoria.style.display = "none";
            videoContainer.style.display = "none";
            gameContainer.style.display = "block";
            placarElemento.style.display = "block";
            video.pause();
            
            cigarra = [{ x: 10, y: 10 }];
            direcao = { x: 1, y: 0 };
            proximaDirecao = { x: 1, y: 0 };
            placar = 0;
            atualizarPlacar();
            gerarFolha();

            estadoJogo = "jogando";
            if(loopJogo) clearInterval(loopJogo);
            loopJogo = setInterval(atualizarJogo, 120); 
        }

        function gerarFolha() {
            folha.x = Math.floor(Math.random() * totalTiles);
            folha.y = Math.floor(Math.random() * totalTiles);
            for (let parte of cigarra) {
                if (parte.x === folha.x && parte.y === folha.y) gerarFolha();
            }
        }

        function atualizarPlacar() {
            placarElemento.innerText = `Cascas: ${placar} / ${META_VITORIA}`;
        }

        function gameOver() {
            estadoJogo = "gameover";
            clearInterval(loopJogo);
            telaGameOver.style.display = "flex";
        }

        function vitoria() {
            estadoJogo = "vitoria";
            clearInterval(loopJogo);
            telaVitoria.style.display = "flex";
        }

        function iniciarVideoFinal() {
            estadoJogo = "assistindo";
            telaVitoria.style.display = "none";
            gameContainer.style.display = "none";
            placarElemento.style.display = "none";
            
            videoContainer.style.display = "block";
            video.src = CAMINHO_VIDEO_VITORIA;
            video.currentTime = 0;

            // Inicia mudo para garantir reprodução imediata do vídeo no celular
            video.muted = true;
            let playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Assim que iniciar o vídeo, tenta desativar o mudo
                    setTimeout(() => { video.muted = false; }, 100);
                }).catch(() => {
                    // Se barrar, qualquer toque libera a mídia com áudio
                    document.addEventListener('touchstart', () => {
                        video.muted = false;
                        video.play();
                    }, { once: true });
                });
            }
        }

        function atualizarJogo() {
            if (estadoJogo !== "jogando") return;

            direcao = proximaDirecao;
            
            const novaCabeca = {
                x: cigarra[0].x + direcao.x,
                y: cigarra[0].y + direcao.y
            };

            if (novaCabeca.x < 0 || novaCabeca.x >= totalTiles || novaCabeca.y < 0 || novaCabeca.y >= totalTiles) {
                return gameOver();
            }

            for (let parte of cigarra) {
                if (novaCabeca.x === parte.x && novaCabeca.y === parte.y) {
                    return gameOver();
                }
            }

            cigarra.unshift(novaCabeca); 

            if (novaCabeca.x === folha.x && novaCabeca.y === folha.y) {
                placar++;
                atualizarPlacar();
                
                if (placar >= META_VITORIA) {
                    return vitoria();
                }
                gerarFolha();
            } else {
                cigarra.pop(); 
            }

            desenharTela();
        }

        function desenharTela() {
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "18px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillText("🍃", folha.x * tamanhoTile + 10, folha.y * tamanhoTile + 10);

            for (let i = 0; i < cigarra.length; i++) {
                let x = cigarra[i].x * tamanhoTile;
                let y = cigarra[i].y * tamanhoTile;

                if (i === 0) {
                    ctx.fillText("🪲", x + 10, y + 10);
                } else {
                    ctx.fillStyle = "#8B5A2B"; 
                    ctx.fillRect(x + 2, y + 2, tamanhoTile - 4, tamanhoTile - 4);
                }
            }
        }

        // ==========================================
        // CLIQUES E TOQUES NA PÁGINA INTEIRA
        // ==========================================
        function lidarComToqueTela(e) {
            if (estadoJogo === "inicio" || estadoJogo === "gameover") {
                iniciarJogo();
            } else if (estadoJogo === "vitoria") {
                iniciarVideoFinal();
            }
        }

        [telaInicio, telaGameOver, telaVitoria].forEach(tela => {
            tela.addEventListener("click", lidarComToqueTela);
            tela.addEventListener("touchstart", lidarComToqueTela, { passive: true });
        });

        // Controles de teclado
        document.addEventListener("keydown", (e) => {
            if (estadoJogo !== "jogando") return;
            if (e.key === "ArrowUp" && direcao.y === 0) proximaDirecao = { x: 0, y: -1 };
            if (e.key === "ArrowDown" && direcao.y === 0) proximaDirecao = { x: 0, y: 1 };
            if (e.key === "ArrowLeft" && direcao.x === 0) proximaDirecao = { x: -1, y: 0 };
            if (e.key === "ArrowRight" && direcao.x === 0) proximaDirecao = { x: 1, y: 0 };
        });

        // Controles de deslize (Swipe) na PÁGINA INTEIRA
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            if (estadoJogo === "jogando") {
                touchStartX = e.touches[0].screenX;
                touchStartY = e.touches[0].screenY;
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (estadoJogo !== "jogando") return;
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let deltaX = touchEndX - touchStartX;
            let deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 30 && direcao.x === 0) proximaDirecao = { x: 1, y: 0 }; 
                else if (deltaX < -30 && direcao.x === 0) proximaDirecao = { x: -1, y: 0 }; 
            } else {
                if (deltaY > 30 && direcao.y === 0) proximaDirecao = { x: 0, y: 1 }; 
                else if (deltaY < -30 && direcao.y === 0) proximaDirecao = { x: 0, y: -1 }; 
            }
        }, { passive: true });

        desenharTela();
    </script>
</body>
</html>
