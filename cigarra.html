<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake da Cigarra</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 95vmin;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(0, 255, 204, 0.2);
            border: 2px solid #333;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        /* ==== TELAS DE SOBREPOSIÇÃO (TELA INTEIRA) ==== */
        .tela-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('cigarra.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
            cursor: pointer;
        }

        .tela-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 1;
        }

        .texto-overlay {
            position: relative;
            z-index: 2;
            color: white;
            font-size: 2rem;
            font-weight: 900;
            width: 90%;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
        }

        .animar-texto {
            animation: 
                entradaEpica 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
                flutuarNeon 2s ease-in-out 0.5s infinite alternate;
        }

        @keyframes entradaEpica {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes flutuarNeon {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.03); }
        }

        #placar {
            color: #00ffcc;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* ==== PLAYER DE VÍDEO FINAL (TELA INTEIRA) ==== */
        #player-video {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 200;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="placar">Cascas: 0 / 13</div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- Tela de Início -->
    <div id="tela-inicio" class="tela-overlay">
        <div class="texto-overlay animar-texto">Toque para iniciar</div>
    </div>

    <!-- Tela de Game Over -->
    <div id="tela-gameover" class="tela-overlay" style="display: none;">
        <div class="texto-overlay animar-texto">
            Fim de jogo!<br><span style="font-size: 1.2rem; font-weight: normal;">Toque em qualquer lugar para tentar de novo</span>
        </div>
    </div>

    <!-- Tela de Vitória -->
    <div id="tela-vitoria" class="tela-overlay" style="display: none;">
        <div class="texto-overlay animar-texto">
            🏆 A cigarra cantou a vitória!<br><span style="font-size: 1.2rem; color: #00ffcc;">Toque para assistir</span>
        </div>
    </div>

    <!-- Vídeo Final sem controles -->
    <video id="player-video" playsinline></video>

    <script>
        // ==========================================
        // DEFINA O CAMINHO DO VÍDEO AQUI
        // ==========================================
        const CAMINHO_VIDEO_VITORIA = "cigarra.mp4";

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        const telaInicio = document.getElementById("tela-inicio");
        const telaGameOver = document.getElementById("tela-gameover");
        const telaVitoria = document.getElementById("tela-vitoria");
        const placarElemento = document.getElementById("placar");
        const video = document.getElementById("player-video");

        const tamanhoTile = 20;
        const totalTiles = canvas.width / tamanhoTile;
        const META_VITORIA = 13; 
        
        let cigarra = [];
        let direcao = { x: 0, y: 0 };
        let proximaDirecao = { x: 0, y: 0 };
        let folha = { x: 0, y: 0 };
        let placar = 0;
        let estadoJogo = "inicio"; 
        let loopJogo;

        function iniciarJogo() {
            telaInicio.style.display = "none";
            telaGameOver.style.display = "none";
            telaVitoria.style.display = "none";
            video.style.display = "none";
            video.pause();
            
            cigarra = [{ x: 10, y: 10 }];
            direcao = { x: 1, y: 0 };
            proximaDirecao = { x: 1, y: 0 };
            placar = 0;
            atualizarPlacar();
            gerarFolha();

            estadoJogo = "jogando";
            if(loopJogo) clearInterval(loopJogo);
            loopJogo = setInterval(atualizarJogo, 120); 
        }

        function gerarFolha() {
            folha.x = Math.floor(Math.random() * totalTiles);
            folha.y = Math.floor(Math.random() * totalTiles);
            for (let parte of cigarra) {
                if (parte.x === folha.x && parte.y === folha.y) gerarFolha();
            }
        }

        function atualizarPlacar() {
            placarElemento.innerText = `Cascas: ${placar} / ${META_VITORIA}`;
        }

        function gameOver() {
            estadoJogo = "gameover";
            clearInterval(loopJogo);
            telaGameOver.style.display = "flex";
        }

        function vitoria() {
            estadoJogo = "vitoria";
            clearInterval(loopJogo);
            telaVitoria.style.display = "flex";
        }

        function iniciarVideoFinal() {
            estadoJogo = "assistindo";
            telaVitoria.style.display = "none";
            video.style.display = "block";
            video.src = CAMINHO_VIDEO_VITORIA;
            video.play().catch(e => console.log("Autoplay barrado:", e));
        }

        function atualizarJogo() {
            if (estadoJogo !== "jogando") return;

            direcao = proximaDirecao;
            
            const novaCabeca = {
                x: cigarra[0].x + direcao.x,
                y: cigarra[0].y + direcao.y
            };

            if (novaCabeca.x < 0 || novaCabeca.x >= totalTiles || novaCabeca.y < 0 || novaCabeca.y >= totalTiles) {
                return gameOver();
            }

            for (let parte of cigarra) {
                if (novaCabeca.x === parte.x && novaCabeca.y === parte.y) {
                    return gameOver();
                }
            }

            cigarra.unshift(novaCabeca); 

            if (novaCabeca.x === folha.x && novaCabeca.y === folha.y) {
                placar++;
                atualizarPlacar();
                
                if (placar >= META_VITORIA) {
                    return vitoria();
                }
                gerarFolha();
            } else {
                cigarra.pop(); 
            }

            desenharTela();
        }

        function desenharTela() {
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "18px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillText("🍃", folha.x * tamanhoTile + 10, folha.y * tamanhoTile + 10);

            for (let i = 0; i < cigarra.length; i++) {
                let x = cigarra[i].x * tamanhoTile;
                let y = cigarra[i].y * tamanhoTile;

                if (i === 0) {
                    ctx.fillText("🪲", x + 10, y + 10);
                } else {
                    ctx.fillStyle = "#8B5A2B"; 
                    ctx.fillRect(x + 2, y + 2, tamanhoTile - 4, tamanhoTile - 4);
                }
            }
        }

        // ==========================================
        // CLIQUES E TOQUES NA PÁGINA INTEIRA
        // ==========================================
        function lidarComToqueTela(e) {
            if (estadoJogo === "inicio" || estadoJogo === "gameover") {
                iniciarJogo();
            } else if (estadoJogo === "vitoria") {
                iniciarVideoFinal();
            }
        }

        [telaInicio, telaGameOver, telaVitoria].forEach(tela => {
            tela.addEventListener("click", lidarComToqueTela);
            tela.addEventListener("touchstart", lidarComToqueTela, { passive: true });
        });

        // Controles de teclado
        document.addEventListener("keydown", (e) => {
            if (estadoJogo !== "jogando") return;
            if (e.key === "ArrowUp" && direcao.y === 0) proximaDirecao = { x: 0, y: -1 };
            if (e.key === "ArrowDown" && direcao.y === 0) proximaDirecao = { x: 0, y: 1 };
            if (e.key === "ArrowLeft" && direcao.x === 0) proximaDirecao = { x: -1, y: 0 };
            if (e.key === "ArrowRight" && direcao.x === 0) proximaDirecao = { x: 1, y: 0 };
        });

        // Controles de deslize (Swipe) na PÁGINA INTEIRA
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            if (estadoJogo === "jogando") {
                touchStartX = e.touches[0].screenX;
                touchStartY = e.touches[0].screenY;
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (estadoJogo !== "jogando") return;
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let deltaX = touchEndX - touchStartX;
            let deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 30 && direcao.x === 0) proximaDirecao = { x: 1, y: 0 }; 
                else if (deltaX < -30 && direcao.x === 0) proximaDirecao = { x: -1, y: 0 }; 
            } else {
                if (deltaY > 30 && direcao.y === 0) proximaDirecao = { x: 0, y: 1 }; 
                else if (deltaY < -30 && direcao.y === 0) proximaDirecao = { x: 0, y: -1 }; 
            }
        }, { passive: true });

        desenharTela();
    </script>
</body>
</html>
